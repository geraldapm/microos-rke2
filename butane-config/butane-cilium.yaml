variant: fcos
version: 1.5.0
storage:
  files:
    - path: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
      contents:
        inline: |
          ---
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: rke2-cilium
            namespace: kube-system
          spec:
            valuesContent: |-
              kubeProxyReplacement: true
              k8sServiceHost: "localhost"
              k8sServicePort: "6443"
            hubble:
              enabled: true
              relay:
                enabled: true
              ui:
                enabled: true
