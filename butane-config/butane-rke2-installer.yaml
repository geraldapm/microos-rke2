variant: fcos
version: 1.5.0
storage:
  files:
    - path: /etc/profile.d/rke2-kubeconfig.sh
      contents:
        inline: |
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          export CRI_CONFIG_FILE=/var/lib/rancher/rke2/agent/etc/crictl.yaml
          export PATH=$PATH:/var/lib/rancher/rke2/bin
    - path: /etc/sysctl.d/60-rke2-cis.conf
      contents:
        inline: |
          vm.panic_on_oom=0
          vm.overcommit_memory=1
          kernel.panic=10
          kernel.panic_on_oops=1
          
systemd:
  units:
    - name: install-rke2.service
      enabled: true
      contents: |
        [Unit]
        Description=rke2 Installer
        After=network-online.target syslog.target
        Wants=network-online.target
        ConditionPathExists=!/usr/local/bin/rke2

        [Service]
        Type=oneshot
        Environment=RKE2_VERSION=###RKE2_VERSION###
        Environment=CNI_SELECTION=###CNI_SELECTION###
        ExecStart=/bin/sh -c 'curl -kL -o /usr/local/bin/rke2 \
          "###RKE2_BINARY_URL###"; \
          chmod +x /usr/local/bin/rke2; /usr/local/bin/rke2 --version; \
          mkdir -p /var/lib/rancher/rke2/agent/images; \
          curl -kL "###RKE2_IMAGE_URL###" -o  /var/lib/rancher/rke2/agent/images/rke2-images-amd64.tar.zst; \
          curl -kL "###RKE2_CNI_URL###" -o  /var/lib/rancher/rke2/agent/images/rke2-images-${CNI_SELECTION}-amd64.tar.zst;'
        RemainAfterExit=true

        [Install]
        WantedBy=multi-user.target
    - name: install-rke2-selinux.service
      enabled: true
      contents: |
        [Unit]
        Description=rke2-selinux Installer
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        TimeoutStartSec=1200
        ExecStart=/bin/sh -c 'transactional-update -n --no-selfupdate run zypper --no-gpg-checks install -y \
          https://github.com/rancher/rke2-selinux/releases/download/v0.23.testing.2/rke2-selinux-0.23-2.slemicro.noarch.rpm; \
          transactional-update apply'
        RemainAfterExit=true

        [Install]
        WantedBy=multi-user.target
